<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilhas em Guerra</title>
<style>
:root{--navy:#071b2c;--cyan:#64d7d1;--sand:#f1d49a;--white:#f4f8f8;--muted:#a9c0c9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#06182788,#041421ee),radial-gradient(ellipse at 50% 110%,#247b87,#10506c 45%,#092b45 78%,#061827);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#b8edf0 1px,transparent 1px);background-size:34px 34px}
.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 20px;position:relative}
.topline{width:min(1100px,100%);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;background:#7de0a2;border-radius:50%;box-shadow:0 0 12px #7de0a2}
main{width:min(520px,100%);margin:auto;text-align:center;padding:35px 0 45px}
.emblem{font-size:54px;margin-bottom:10px}h1{font-size:clamp(42px,8vw,66px);line-height:.95;letter-spacing:3px;margin:0;color:var(--sand);text-shadow:0 5px 0 #7e5b36,0 12px 28px #00131f}
.subtitle{color:#c3d8dc;letter-spacing:3px;text-transform:uppercase;font-size:11px;margin:18px 0 34px}
.menu{display:grid;gap:12px;width:min(360px,100%);margin:auto}
button{font:inherit;cursor:pointer;border:0}.menu-btn{position:relative;padding:17px 22px;border:1px solid #95e0e04d;border-radius:10px;background:linear-gradient(110deg,#144c63f5,#0c3046f5);color:var(--white);font-size:15px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 5px 0 #041827,0 12px 22px #00121d66;transition:.16s}
.menu-btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.menu-btn.primary{background:linear-gradient(110deg,#d6ad68,#a8793e);color:#172b35;border-color:#f4d69d;box-shadow:0 5px 0 #674626,0 12px 22px #00121d66}
.menu-btn .symbol{position:absolute;left:18px;font-size:18px}.footer{color:#8eabb7;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.modal-wrap{position:fixed;inset:0;background:#020d17d9;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-wrap.show{display:flex}
.modal{width:min(460px,100%);max-height:90vh;overflow:auto;padding:27px;border:1px solid #4b8995;border-radius:16px;background:linear-gradient(145deg,#123c53,#081e31);box-shadow:0 25px 80px #0009;text-align:left}
.modal h2{margin:0 0 8px;color:var(--sand);font-size:25px}.modal p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px}
label{display:block;font-size:12px;color:#c4dce0;text-transform:uppercase;letter-spacing:1px;margin:14px 0 7px}
input,select{width:100%;padding:13px 14px;border-radius:8px;border:1px solid #477181;background:#061b2a;color:white;font:inherit;outline:none}input:focus,select:focus{border-color:var(--cyan)}
.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;padding:13px;border-radius:8px;font-weight:700}.confirm{background:var(--sand);color:#172b35}.cancel{background:#21485b;color:white}
.notice{padding:12px;border-radius:8px;background:#0a2a3d;color:#b9d5db;font-size:13px;margin-top:13px;display:none;line-height:1.45}
.players{display:grid;gap:9px;margin:15px 0}.player{display:flex;align-items:center;gap:11px;padding:12px;border-radius:9px;background:#0a2a3d;border:1px solid #285568}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#1d6570}.player small{display:block;color:#9ebdc5;margin-top:3px}.host{margin-left:auto;color:var(--sand);font-size:11px;text-transform:uppercase}
.room-code{padding:14px;text-align:center;border:1px dashed #69c9c4;border-radius:9px;color:var(--sand);font-size:25px;font-weight:800;letter-spacing:5px;margin:12px 0}
.muted{color:#91b0bb;font-size:12px}.online{color:#8fe0aa}.actions .danger{background:#673c43;color:white}
@media(max-width:500px){.topline{font-size:9px}.shell{padding-top:20px}}
</style>
</head>
<body>
<div class="shell">
<div class="topline"><span>⚓ Jogo de estratégia entre amigos</span><span class="status"><i class="dot"></i><span id="connection">Conectando...</span></span></div>
<main>
<div class="emblem">🏝️</div><h1>ILHAS<br>EM GUERRA</h1>
<div class="subtitle">Conquiste. Sobreviva. Domine o mar.</div>
<div class="menu">
<button class="menu-btn primary" onclick="openJoin()"><span class="symbol">➤</span>Jogar</button>
<button class="menu-btn" onclick="openCreate()"><span class="symbol">⚑</span>Criar sala</button>
<button class="menu-btn" onclick="openFriends()"><span class="symbol">♟</span>Amigos</button>
<button class="menu-btn" onclick="openSettings()"><span class="symbol">⚙</span>Configurações</button>
</div>
</main><div class="footer">Até 3 jogadores • Partidas online</div>
</div>
<div class="modal-wrap" id="wrap" onclick="outsideClose(event)"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let myName=localStorage.getItem('islandPlayerName')||'';let currentRoom=null;let isHost=false;let latestRoom=null;
const wrap=document.getElementById('wrap'),modal=document.getElementById('modal');
socket.on('connect',()=>document.getElementById('connection').textContent='Online');
socket.on('disconnect',()=>document.getElementById('connection').textContent='Reconectando...');
socket.on('roomUpdate',room=>{if(currentRoom===room.code){latestRoom=room;renderLobby(room)}});
socket.on('roomCreated',room=>{currentRoom=room.code;isHost=true;latestRoom=room;renderLobby(room)});
socket.on('joinedRoom',room=>{currentRoom=room.code;isHost=false;latestRoom=room;renderLobby(room)});
socket.on('roomError',msg=>showNotice(msg));
socket.on('roomClosed',()=>{currentRoom=null;isHost=false;showMenuMessage('O anfitrião encerrou a sala.')});
socket.on('gameStarting',room=>{renderStarting(room)});
socket.on('playerLeft',()=>{});
function show(html){modal.innerHTML=html;wrap.classList.add('show')}
function close(){wrap.classList.remove('show')}
function outsideClose(e){if(e.target===wrap)close()}
function playerField(){return `<label>Seu nome</label><input id="playerName" maxlength="16" value="${escapeHtml(myName)}" placeholder="Como seus amigos te chamam">`}
function saveName(){const n=document.getElementById('playerName')?.value.trim();if(!n){showNotice('Digite seu nome para continuar.');return false}myName=n;localStorage.setItem('islandPlayerName',n);return true}
function openCreate(){show(`<h2>Criar sala</h2><p>Crie uma sala e compartilhe o código com seus amigos. Cabem até 3 jogadores.</p>${playerField()}<label>Jogadores</label><select id="capacity"><option value="2">2 jogadores</option><option value="3" selected>3 jogadores</option></select><div class="notice" id="notice"></div><div class="actions"><button class="cancel" onclick="close()">Voltar</button><button class="confirm" onclick="createRoom()">Criar sala</button></div>`)}
function createRoom(){if(!saveName())return;socket.emit('createRoom',{name:myName,maxPlayers:Number(document.getElementById('capacity').value)})}
function openJoin(){show(`<h2>Entrar em uma sala</h2><p>Peça o código ao anfitrião e entre na partida.</p>${playerField()}<label>Código da sala</label><input id="roomCode" maxlength="6" placeholder="Ex.: A7K2QX" style="text-transform:uppercase"><div class="notice" id="notice"></div><div class="actions"><button class="cancel" onclick="close()">Voltar</button><button class="confirm" onclick="joinRoom()">Entrar</button></div>`)}
function joinRoom(){if(!saveName())return;const code=document.getElementById('roomCode').value.trim().toUpperCase();if(!code){showNotice('Digite o código da sala.');return}socket.emit('joinRoom',{code,name:myName})}
function renderLobby(room){
currentRoom=room.code;show(`<h2>Sala de espera</h2><p>Compartilhe este código com seus amigos para eles entrarem.</p><div class="room-code">${room.code}</div><div class="muted" style="text-align:center">Jogadores: ${room.players.length}/${room.maxPlayers}</div><div class="players">${room.players.map((p,i)=>`<div class="player"><div class="avatar">${i===0?'👑':'⚓'}</div><div>${escapeHtml(p.name)}<small class="online">● Conectado</small></div>${p.id===room.hostId?'<span class="host">Anfitrião</span>':''}</div>`).join('')}</div><div class="muted">${room.players.length<2?'Aguardando mais jogadores...':'Todos prontos para a próxima etapa!'}</div><div class="notice" id="notice"></div><div class="actions"><button class="danger" onclick="leaveRoom()">Sair da sala</button>${room.hostId===socket.id?`<button class="confirm" onclick="startGame()" ${room.players.length<2?'disabled style="opacity:.45;cursor:not-allowed"':''}>Iniciar partida</button>`:''}</div>`);
}
function startGame(){socket.emit('startGame',{code:currentRoom})}
function renderStarting(room){show(`<h2>Partida iniciada!</h2><p>Os jogadores estão reunidos. Esta etapa confirma o início sincronizado da partida.</p><div class="players">${room.players.map(p=>`<div class="player"><div class="avatar">🏝️</div><div>${escapeHtml(p.name)}<small>Na partida</small></div></div>`).join('')}</div><div class="notice" style="display:block">O lobby multiplayer está funcionando. A próxima etapa será conectar o tabuleiro e as regras do jogo a esta sala.</div><div class="actions"><button class="cancel" onclick="leaveRoom()">Voltar ao menu</button></div>`)}
function leaveRoom(){socket.emit('leaveRoom');currentRoom=null;isHost=false;showMenuMessage('Você saiu da sala.')}
function showMenuMessage(msg){show(`<h2>Ilhas em Guerra</h2><p>${escapeHtml(msg)}</p><div class="actions"><button class="confirm" onclick="close()">Continuar</button></div>`)}
function showNotice(msg){let n=document.getElementById('notice');if(!n){modal.insertAdjacentHTML('beforeend','<div class="notice" id="notice"></div>');n=document.getElementById('notice')}n.textContent=msg;n.style.display='block'}
function openFriends(){show(`<h2>Amigos</h2><p>Por enquanto, convide seus amigos compartilhando o código da sala criada.</p><div class="notice" style="display:block">Lista de amigos e convites diretos poderão ser adicionados depois. O multiplayer por código já está disponível.</div><div class="actions"><button class="cancel" onclick="close()">Fechar</button></div>`)}
function openSettings(){show(`<h2>Configurações</h2><p>Preferências desta versão.</p><label>Volume</label><select><option>Desligado</option><option selected>Normal</option><option>Alto</option></select><label>Efeitos visuais</label><select><option>Reduzidos</option><option selected>Normais</option><option>Altos</option></select><div class="actions"><button class="confirm" onclick="close()">Salvar</button></div>`)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script>
</body></html>
