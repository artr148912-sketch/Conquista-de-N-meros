<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ilhas em Guerra</title>
<style>
:root{--navy:#071b2c;--cyan:#64d7d1;--sand:#f1d49a;--white:#f4f8f8;--muted:#a9c0c9;--panel:#0c2a3d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--white);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 50% 110%,#247b87,#10506c 45%,#092b45 78%,#061827);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(#b8edf0 1px,transparent 1px);background-size:34px 34px}.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px;position:relative}.topline{width:min(1200px,100%);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}.status{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;background:#7de0a2;border-radius:50%;box-shadow:0 0 12px #7de0a2}main{width:min(1200px,100%);margin:auto;padding:25px 0 35px;text-align:center}.emblem{font-size:54px;margin-bottom:10px}h1{font-size:clamp(40px,8vw,66px);line-height:.95;letter-spacing:3px;margin:0;color:var(--sand);text-shadow:0 5px 0 #7e5b36,0 12px 28px #00131f}.subtitle{color:#c3d8dc;letter-spacing:3px;text-transform:uppercase;font-size:11px;margin:18px 0 34px}.menu{display:grid;gap:12px;width:min(360px,100%);margin:auto}button{font:inherit;cursor:pointer;border:0}.menu-btn{position:relative;padding:17px 22px;border:1px solid #95e0e04d;border-radius:10px;background:linear-gradient(110deg,#144c63f5,#0c3046f5);color:var(--white);font-size:15px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 5px 0 #041827,0 12px 22px #00121d66;transition:.16s}.menu-btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.menu-btn.primary{background:linear-gradient(110deg,#d6ad68,#a8793e);color:#172b35;border-color:#f4d69d}.menu-btn .symbol{position:absolute;left:18px;font-size:18px}.footer{color:#8eabb7;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}.modal-wrap{position:fixed;inset:0;background:#020d17d9;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-wrap.show{display:flex}.modal{width:min(540px,100%);max-height:92vh;overflow:auto;padding:27px;border:1px solid #4b8995;border-radius:16px;background:linear-gradient(145deg,#123c53,#081e31);box-shadow:0 25px 80px #0009;text-align:left}.modal h2{margin:0 0 8px;color:var(--sand);font-size:25px}.modal p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 18px}label{display:block;font-size:12px;color:#c4dce0;text-transform:uppercase;letter-spacing:1px;margin:14px 0 7px}input,select{width:100%;padding:12px 13px;border-radius:8px;border:1px solid #477181;background:#061b2a;color:white;font:inherit;outline:none}input:focus,select:focus{border-color:var(--cyan)}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.actions button,.btn{flex:1;padding:12px;border-radius:8px;font-weight:700}.confirm{background:var(--sand);color:#172b35}.cancel{background:#21485b;color:white}.danger{background:#673c43;color:white}.notice{padding:12px;border-radius:8px;background:#0a2a3d;color:#b9d5db;font-size:13px;margin-top:13px;display:none;line-height:1.45}.players{display:grid;gap:9px;margin:15px 0}.player{display:flex;align-items:center;gap:11px;padding:12px;border-radius:9px;background:#0a2a3d;border:1px solid #285568}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#1d6570}.player small{display:block;color:#9ebdc5;margin-top:3px}.host{margin-left:auto;color:var(--sand);font-size:11px;text-transform:uppercase}.room-code{padding:14px;text-align:center;border:1px dashed #69c9c4;border-radius:9px;color:var(--sand);font-size:25px;font-weight:800;letter-spacing:5px;margin:12px 0}.muted{color:#91b0bb;font-size:12px}.online{color:#8fe0aa}.game{width:min(1200px,100%);margin:0 auto;text-align:left}.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.game-head h2{margin:0;color:var(--sand)}.phase{padding:8px 12px;background:#0b3045;border:1px solid #32687a;border-radius:20px;color:#bde9e7;font-size:12px}.ocean{position:relative;overflow:hidden;border:1px solid #3b8192;border-radius:18px;background:radial-gradient(ellipse at 50% 45%,#167b94,#0d526f 55%,#082e4b);padding:20px;box-shadow:inset 0 0 60px #001a2c88}.ocean:before{content:"";position:absolute;inset:0;opacity:.18;background:repeating-radial-gradient(ellipse at 20% 30%,transparent 0 38px,#8be5e3 40px 41px,transparent 43px 90px);pointer-events:none}.islands{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:center;min-height:310px}.island-card{position:relative;z-index:1;text-align:center;min-width:0}.island{position:relative;margin:0 auto 10px;width:min(100%,245px);height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 10px 4px #00253699)}.island:before{content:"";position:absolute;inset:13px 3px 5px;border-radius:46% 54% 42% 58% / 49% 39% 61% 51%;background:linear-gradient(145deg,#ffe4a8,#d8a65f 58%,#a96d3d);border:5px solid #f3d49a;transform:rotate(-5deg)}.island:after{content:"";position:absolute;inset:26px 16px 18px;border-radius:48% 52% 58% 42%;background:linear-gradient(145deg,#65b96b,#26794f);clip-path:polygon(8% 23%,29% 3%,53% 14%,76% 0,100% 32%,91% 76%,67% 100%,34% 86%,0 67%)}.island .palm,.island .unit{position:relative;z-index:2;font-size:24px;filter:drop-shadow(0 2px 1px #153c2a)}.island .palm{font-size:31px;margin-bottom:3px}.island .unit{font-size:18px;letter-spacing:1px}.island-name{font-weight:800;font-size:15px;margin-bottom:7px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin:0 auto;max-width:245px}.stat{background:#06243acb;border:1px solid #4d8b9a66;border-radius:7px;padding:6px 4px;font-size:12px}.stat b{color:#fff}.hpbar{height:8px;background:#092032;border-radius:20px;overflow:hidden;margin:7px auto;width:min(100%,210px)}.hpbar span{display:block;height:100%;background:linear-gradient(90deg,#5edc9a,#b8e879)}.island-card.dead{opacity:.38;filter:grayscale(1)}.island-card.me .island-name:after{content:' • VOCÊ';color:#bde9e7;font-size:10px}.panel-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:14px}.panel{background:#09283c;border:1px solid #2d6073;border-radius:13px;padding:16px}.panel h3{margin:0 0 10px;color:var(--sand);font-size:17px}.resource-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#123c51;border:1px solid #346b7a;border-radius:20px;padding:7px 10px;font-size:12px}.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.shop-grid button,.action-grid button{background:#17485d;color:#f2f8f7;border:1px solid #397589;border-radius:8px;padding:10px;text-align:left;font-size:12px;line-height:1.4}.shop-grid button:disabled,.action-grid button:disabled{opacity:.35;cursor:not-allowed}.shop-grid b,.action-grid b{display:block;color:var(--sand);font-size:13px;margin-bottom:3px}.action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.target-select{margin-top:8px}.log{max-height:155px;overflow:auto;display:grid;gap:6px;color:#c0d7dc;font-size:12px}.log div{padding:6px 8px;background:#061f31;border-radius:6px}.wide{width:100%;margin-top:10px}.math-box{padding:13px;background:#08283a;border:1px solid #3d7d8c;border-radius:10px;margin-top:10px}.math-box strong{display:block;color:var(--sand);font-size:17px;margin-bottom:8px}.small{font-size:11px;color:#9ebdc5;line-height:1.45}.shop-challenge{display:grid;grid-template-columns:1fr 100px;gap:7px}.modal.game-modal{width:min(1240px,100%);max-height:96vh;padding:16px;background:linear-gradient(145deg,#0b2d40,#061a2b)}.hidden{display:none!important}
@media(max-width:760px){.islands{grid-template-columns:1fr;gap:2px}.island-card{display:grid;grid-template-columns:115px 1fr;align-items:center;text-align:left;gap:8px}.island{width:115px;height:90px;margin:0}.island:before{inset:10px 2px 5px}.island:after{inset:18px 10px 12px}.island .palm{font-size:20px}.island .unit{font-size:12px}.island-name{font-size:13px}.stats{max-width:none}.hpbar{margin-left:0}.panel-grid{grid-template-columns:1fr}.shell{padding:14px}.ocean{padding:12px}}
</style>
</head><body><div class="shell"><div class="topline"><span>⚓ Jogo de estratégia entre amigos</span><span class="status"><i class="dot"></i><span id="connection">Conectando...</span></span></div><main id="home"><div class="emblem">🏝️</div><h1>ILHAS<br>EM GUERRA</h1><div class="subtitle">Conquiste. Sobreviva. Domine o mar.</div><div class="menu"><button class="menu-btn primary" onclick="openJoin()"><span class="symbol">➤</span>Jogar</button><button class="menu-btn" onclick="openCreate()"><span class="symbol">⚑</span>Criar sala</button><button class="menu-btn" onclick="openFriends()"><span class="symbol">♟</span>Amigos</button><button class="menu-btn" onclick="openSettings()"><span class="symbol">⚙</span>Configurações</button></div></main><div class="footer" id="footer">Até 3 jogadores • Partidas online</div></div>
<div class="modal-wrap" id="wrap" onclick="outsideClose(event)"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io();let myName=localStorage.getItem('islandPlayerName')||'',currentRoom=null,latestRoom=null,mathQuestion=null;const wrap=document.getElementById('wrap'),modal=document.getElementById('modal');
socket.on('connect',()=>document.getElementById('connection').textContent='Online');socket.on('disconnect',()=>document.getElementById('connection').textContent='Reconectando...');
socket.on('roomUpdate',r=>{if(currentRoom===r.code){latestRoom=r;renderLobby(r)}});socket.on('roomCreated',r=>{currentRoom=r.code;latestRoom=r;renderLobby(r)});socket.on('joinedRoom',r=>{currentRoom=r.code;latestRoom=r;renderLobby(r)});socket.on('roomError',showNotice);socket.on('roomClosed',()=>{currentRoom=null;showMenuMessage('O anfitrião saiu da sala.')});socket.on('gameState',r=>{if(currentRoom===r.code){latestRoom=r;renderGame(r)}});socket.on('mathChallenge',q=>{mathQuestion=q;renderMathQuestion(q)});
function show(html){modal.classList.toggle('game-modal',html.includes('class=\"game\"'));modal.innerHTML=html;wrap.classList.add('show')}function close(){wrap.classList.remove('show')}function outsideClose(e){if(e.target===wrap)close()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function playerField(){return `<label>Seu nome</label><input id="playerName" maxlength="16" value="${esc(myName)}" placeholder="Como seus amigos te chamam">`}function saveName(){let n=document.getElementById('playerName')?.value.trim();if(!n){showNotice('Digite seu nome para continuar.');return false}myName=n;localStorage.setItem('islandPlayerName',n);return true}
function openCreate(){show(`<h2>Criar sala</h2><p>Crie uma sala e compartilhe o código com seus amigos. Cabem até 3 jogadores.</p>${playerField()}<label>Jogadores</label><select id="capacity"><option value="2">2 jogadores</option><option value="3" selected>3 jogadores</option></select><div class="notice" id="notice"></div><div class="actions"><button class="cancel" onclick="close()">Voltar</button><button class="confirm" onclick="createRoom()">Criar sala</button></div>`)}function createRoom(){if(saveName())socket.emit('createRoom',{name:myName,maxPlayers:+document.getElementById('capacity').value})}
function openJoin(){show(`<h2>Entrar em uma sala</h2><p>Peça o código ao anfitrião e entre na partida.</p>${playerField()}<label>Código da sala</label><input id="roomCode" maxlength="6" placeholder="Ex.: A7K2QX" style="text-transform:uppercase"><div class="notice" id="notice"></div><div class="actions"><button class="cancel" onclick="close()">Voltar</button><button class="confirm" onclick="joinRoom()">Entrar</button></div>`)}function joinRoom(){if(saveName()){const code=document.getElementById('roomCode').value.trim().toUpperCase();if(!code)return showNotice('Digite o código da sala.');socket.emit('joinRoom',{code,name:myName})}}
function renderLobby(r){show(`<h2>Sala de espera</h2><p>Compartilhe este código com seus amigos para eles entrarem.</p><div class="room-code">${r.code}</div><div class="muted" style="text-align:center">Jogadores: ${r.players.length}/${r.maxPlayers}</div><div class="players">${r.players.map((p,i)=>`<div class="player"><div class="avatar">🏝️</div><div>${esc(p.name)}<small class="online">● Conectado</small></div>${p.id===r.hostId?'<span class="host">Anfitrião</span>':''}</div>`).join('')}</div><div class="notice" id="notice"></div><div class="actions"><button class="danger" onclick="leaveRoom()">Sair da sala</button>${r.hostId===socket.id?`<button class="confirm" onclick="startGame()" ${r.players.length<2?'disabled':''}>Iniciar partida</button>`:''}</div>`)}function startGame(){socket.emit('startGame',{code:currentRoom})}function leaveRoom(){socket.emit('leaveRoom');currentRoom=null;latestRoom=null;close();document.getElementById('home').classList.remove('hidden');document.getElementById('footer').classList.remove('hidden')}
function renderGame(r){document.getElementById('home').classList.add('hidden');document.getElementById('footer').classList.add('hidden');close();const me=r.players.find(p=>p.id===socket.id);if(!me)return;const targets=r.players.filter(p=>p.id!==socket.id&&!p.eliminated);const phaseLabel=r.phase==='shop'?'Turno sem ação • Loja':r.phase==='action'?'Turno de ação':r.phase==='finished'?'Partida encerrada':'Sala';const map=r.players.map(p=>`<div class="island-card ${p.eliminated?'dead':''} ${p.id===socket.id?'me':''}"><div class="island" style="--island:${p.color}"><span class="palm">🌴</span><span class="unit">${p.commander?'👑 ':''}${'🪖 '.repeat(Math.min(8,p.soldiers))}${p.orchards?'🌳'.repeat(Math.min(3,p.orchards)):''}</span></div><div><div class="island-name" style="color:${p.color}">${esc(p.name)}${p.eliminated?' • ELIMINADO':''}</div><div class="hpbar"><span style="width:${p.hp/p.maxHp*100}%"></span></div><div class="stats"><div class="stat">❤️ <b>${p.hp}/${p.maxHp}</b></div><div class="stat">🪖 <b>${p.soldiers}</b></div><div class="stat">🌳 <b>${p.orchards}</b></div><div class="stat">⚔️ <b>${p.fort?'+4 PA':'0 PA'}</b></div></div></div></div>`).join('');
let controls='';if(r.phase==='shop'){controls=`<div class="panel"><h3>🛒 Loja e preparação</h3><div class="resource-row"><span class="pill">💵 $${me.dollars}</span><span class="pill">🌸 ${me.pink} moedas rosas</span><span class="pill">💣 ${me.bombs} bombas</span><span class="pill">🚢 ${me.submarine?'Submarino +'+(me.submarineLevel*10):'Sem submarino'}</span></div><div class="shop-grid"><button onclick="buy('heal')" ${me.dollars<5?'disabled':''}><b>🩹 Curandeiro — $5</b>Recupera 10 de vida. Com $10 ou mais, compra 2.</button><button onclick="buy('fort')" ${me.dollars<6||me.fort?'disabled':''}><b>🏰 Forte — $6</b>Construção permanente: +4 de dano.</button><button onclick="buy('orchards')" ${me.pink<2||me.boughtOrchards?'disabled':''}><b>🌳 3 Pomares — 2 🌸</b>Compra única; +30 de vida e proteção.</button><button onclick="buy('submarine')" ${me.pink<3||me.submarine?'disabled':''}><b>🚢 Submarino — 3 🌸</b>Ataca um inimigo a cada turno.</button><button onclick="buy('upgradeSub')" ${me.pink<1||!me.submarine?'disabled':''}><b>⬆️ Aprimorar — 1 🌸</b>+10 de dano do submarino.</button><button onclick="buy('commander')" ${me.pink<5||me.soldiers<6||me.commander?'disabled':''}><b>👑 Comandante — 5 🌸 + 6 soldados</b>+25 de vida e 30 de dano em cada inimigo por turno.</button></div>${me.submarine?`<label>Alvo do submarino</label><select id="subTarget" onchange="setSubTarget()"><option value="">Escolha um inimigo</option>${targets.map(p=>`<option value="${p.id}" ${me.submarineTarget===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}<label>Questão matemática para seus inimigos</label><div class="small">Quem atacar sua ilha terá que responder à sua questão. Se não definir uma, o jogo cria uma automaticamente.</div><div class="shop-challenge"><input id="qText" maxlength="140" placeholder="Ex.: Quanto é a área de 8 × 5?" value="${esc(me.challenge?.question||'')}"><input id="qAnswer" type="number" placeholder="Resposta" value=""></div><button class="btn cancel wide" onclick="setChallenge()">Salvar questão</button><button class="btn confirm wide" onclick="readyShop()" ${me.ready?'disabled':''}>${me.ready?'Aguardando os outros...':'Estou pronto para o turno de ação'}</button></div>`}
else if(r.phase==='action'){controls=`<div class="panel"><h3>⚔️ Escolha sua ação</h3><div class="resource-row"><span class="pill">💵 $${me.dollars}</span><span class="pill">🪖 ${me.soldiers} soldados</span><span class="pill">💣 ${me.bombs} bombas</span></div>${me.action?`<div class="notice" style="display:block">Ação enviada. Aguardando os outros jogadores${me.action.type==='attack'&&!me.action.answered?' e sua resposta matemática':''}.</div>`:`<label>Escolha o alvo</label><select id="target"><option value="">Selecione um adversário</option>${targets.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="action-grid" style="margin-top:10px"><button onclick="choose('attack')"><b>⚔️ Atacar ilha</b>Seus soldados causam 2 de dano cada; exige resolver uma questão.</button><button onclick="choose('explore')"><b>🎲 Explorar recursos</b>Role de 1 a 4 para encontrar recursos.</button><button onclick="choose('bomb')" ${me.bombs<1?'disabled':''}><b>💣 Usar bomba</b>Destrói até 2 pomares ou causa 10 de dano.</button></div>`}`}
else if(r.phase==='finished'){const winner=r.players.find(p=>p.id===r.winnerId);controls=`<div class="panel"><h3>🏆 ${winner?esc(winner.name)+' venceu!':'Partida encerrada'}</h3><p>Você pode voltar ao menu ou iniciar outra sala.</p><button class="btn confirm wide" onclick="leaveRoom()">Voltar ao menu</button></div>`}
const logHtml=[...r.log].reverse().map(x=>`<div>${esc(x)}</div>`).join('');show(`<div class="game"><div class="game-head"><div><h2>🏝️ Ilhas em Guerra</h2><span class="muted">Sala ${r.code} • Rodada ${r.round+1}</span></div><span class="phase">${phaseLabel}</span></div><div class="ocean"><div class="islands">${map}</div></div><div class="panel-grid">${controls}<div class="panel"><h3>📜 Diário da partida</h3><div class="log">${logHtml||'<div>A partida começou. Prepare sua ilha!</div>'}</div><div class="small" style="margin-top:10px">PA: cada soldado causa 2 de dano. O Forte acrescenta 4 de dano. Pomares aumentam a vida em 10 e bloqueiam até 5 de dano por ataque.</div></div></div></div>`);if(mathQuestion&&me.action?.type==='attack'&&!me.action.answered)renderMathQuestion(mathQuestion)}
function buy(item){socket.emit('buyItem',{item})}function readyShop(){socket.emit('shopReady')}function setSubTarget(){socket.emit('setSubmarineTarget',{targetId:document.getElementById('subTarget').value})}function setChallenge(){const question=document.getElementById('qText').value,answer=document.getElementById('qAnswer').value;if(!question.trim()||answer==='')return showNotice('Preencha a questão e a resposta numérica.');socket.emit('setChallenge',{question,answer:Number(answer)});showNotice('Questão enviada!')}
function choose(type){const targetId=document.getElementById('target')?.value;if((type==='attack'||type==='bomb')&&!targetId)return showNotice('Escolha um adversário primeiro.');socket.emit('chooseAction',{type,targetId})}function renderMathQuestion(q){show(`<h2>🧠 Resolva a questão!</h2><p>O adversário preparou esta questão. Se acertar, seu ataque será realizado. Se errar, não haverá ataque.</p><div class="math-box"><strong>${esc(q.question)}</strong><input id="mathAnswer" type="number" placeholder="Sua resposta"></div><div class="actions"><button class="confirm" onclick="submitMath()">Enviar resposta</button></div>`)}function submitMath(){const v=document.getElementById('mathAnswer')?.value;if(v==='')return showNotice('Digite sua resposta.');mathQuestion=null;socket.emit('answerChallenge',{answer:Number(v)});close()}
function showNotice(msg){let n=document.getElementById('notice');if(!n){modal.insertAdjacentHTML('beforeend','<div class="notice" id="notice"></div>');n=document.getElementById('notice')}n.textContent=msg;n.style.display='block'}function showMenuMessage(msg){show(`<h2>Ilhas em Guerra</h2><p>${esc(msg)}</p><div class="actions"><button class="confirm" onclick="close()">Continuar</button></div>`)}function openFriends(){show(`<h2>Amigos</h2><p>Convide seus amigos compartilhando o código da sala criada.</p><div class="notice" style="display:block">Lista de amigos e convites diretos poderão ser adicionados depois. O multiplayer por código já está disponível.</div><div class="actions"><button class="cancel" onclick="close()">Fechar</button></div>`)}function openSettings(){show(`<h2>Configurações</h2><p>Preferências desta versão.</p><label>Volume</label><select><option>Desligado</option><option selected>Normal</option><option>Alto</option></select><label>Efeitos visuais</label><select><option>Reduzidos</option><option selected>Normais</option><option>Altos</option></select><div class="actions"><button class="confirm" onclick="close()">Salvar</button></div>`)}document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
</script></body></html>
